faqs:
  - question: How quickly can we get started?
    answer:
      Most engagements kick off within a week of our first call — we start
      with a short discovery session to scope the work before anything is
      scheduled.
  - question: Do you work with early-stage teams?
    answer:
      Yes. We work with teams from first product through scale, and tailor
      the engagement size to where you are.
  - question: What does a typical engagement look like?
    answer:
      We start with a scoping conversation, agree a plan and timeline, then
      work in short, reviewable cycles so you always know what's shipping
      next.
  - question: Can you work with our existing team?
    answer:
      Absolutely — we regularly embed alongside in-house engineers and
      designers rather than working in isolation.
  - question: How do you handle pricing?
    answer:
      Pricing depends on scope — project-based for defined work, retainer-based
      for ongoing partnerships. We'll recommend the right model on our first call.
